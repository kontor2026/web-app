# Statische Pakete aus packages/ auf GitHub Pages: https://kontor2026.github.io/web-app/<paket>/
# Einmalig nötig: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ['packages/**', 'data/**', 'backend/seed/**', 'tools/kategorien/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pakete bauen
        run: |
          mkdir -p _site
          cp packages/index.html _site/
          for p in packages/*/; do
            [ -f "$p/package.json" ] || continue
            name=$(basename "$p")
            (cd "$p" && npm ci && npm run build)
            cp -r "$p/dist" "_site/$name"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

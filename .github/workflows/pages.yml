# Statische Seite aus packages/site auf GitHub Pages: https://kontor2026.github.io/web-app/
# Übersicht, Rohstoff-Atlas (/atlas/), 3D-Modelle (/modelle/), KI-Kompass (/kompass/).
# Einmalig nötig: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ['packages/**', 'data/**', 'backend/seed/**', 'tools/kategorien/**', 'css/**', 'js/data/**', 'js/iso.js', 'vendor/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Seite bauen (packages/site)
        working-directory: packages/site
        run: npm ci && npm run build
      - run: mv packages/site/dist _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

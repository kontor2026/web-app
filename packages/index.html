<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kreislauf-Station · Pakete</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #EEECE5; --card: #fff; --ink: #1D201E; --ink-2: #555A55; --rule: #D2CFC5; --accent: #D9480F; }
    @media (prefers-color-scheme: dark) { :root { --paper: #141615; --card: #222524; --ink: #E7E4DB; --ink-2: #AEB1A9; --rule: #3A3D3A; --accent: #EC5A1E; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-content: center; gap: 24px; padding: 32px; background: var(--paper); color: var(--ink); font: 15px/1.5 'IBM Plex Sans', system-ui, sans-serif; }
    p.ueber { font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    h1 { font-size: 30px; font-weight: 600; }
    .karten { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; max-width: 640px; }
    a { display: block; padding: 18px; border: 1px solid var(--rule); border-radius: 10px; background: var(--card); color: inherit; text-decoration: none; }
    a:hover { border-color: var(--accent); }
    a b { display: block; font-size: 18px; } a span { color: var(--ink-2); }
  </style>
</head>
<body>
  <header><p class="ueber">Kreislauf-Station</p><h1>Was steckt in unseren Dingen?</h1></header>
  <nav class="karten">
    <a href="graph/"><b>Stoffgraph</b><span>201 Gegenstände, ihre Bauteile und Materialien als 3D-Netz.</span></a>
    <a aria-disabled="true" style="opacity:.55;pointer-events:none"><b>Wertschöpfungskette</b><span>Woher die Rohstoffe kommen. In Arbeit.</span></a>
  </nav>
</body>
</html>
